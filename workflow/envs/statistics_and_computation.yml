# workflow/envs/statistics_and_computation.yml
# Computation environment: numerical analysis, depletion scoring, curve fitting.
# NO plotting libraries — those live in cnsplots.yml.
name: statistics_and_computation
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - numpy>=2.5.0
  - pandas>=3.0.3
  - scipy>=1.18
  - scikit-learn>=1.9
  - joblib>=1.4
  - pyyaml
  - openpyxl
  - tqdm
  - loguru
  - tabulate
  - pyarrow=24.0.0
  - matplotlib
